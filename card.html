<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-brands/css/uicons-brands.css'>
    <link rel="stylesheet" href="/card.css">
    <title>Card Perfil</title>
</head>
<body>
    <div class="container">
        <div class="profile-wrapper">
            <div class="profile">
                <div class="profile-image">
                    <img src="/img/eu.jpeg" alt="profile">
                </div>
                <ul class="social-icons">
                <li>
                    <a href="#" title="Instagram">
                        <i class="fi fi-brands-instagram"></i>
                    </a>
                </li>
                <li>
                    <a href="#" title="GitHub">
                        <i class="fi fi-brands-github"></i>
                    </a>
                </li>
                <li>
                    <a href="#" title="Discord">
                        <i class="fi fi-brands-discord"></i>
                    </a>
                </li>
                <li>
                    <a href="#" title="Linkedin">
                        <i class="fi fi-brands-linkedin"></i>
                    </a>
                </li>
                </ul>
                <div class="profile-name">
                    <h2>Emilly de Oliveira Alves</h2>
                    <div class="profile-bio">Sou desenvolvedora Front-end, trabalho com <em>Html</em>, <em>Css</em> e <em>JavaScript</em></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
